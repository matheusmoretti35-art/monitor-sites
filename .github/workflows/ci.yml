name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - status.json
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        run: pytest -q

      - name: Validar sites.txt
        run: python -c "import monitor; s = monitor.carregar_sites(); assert s, 'sites.txt vazio'; print(len(s), 'site(s) OK')"
