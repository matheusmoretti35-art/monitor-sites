[project]
name = "monitor-sites"
version = "1.0.0"
description = "Monitor de disponibilidade e SSL de sites com relatório no Telegram/WhatsApp via GitHub Actions"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
